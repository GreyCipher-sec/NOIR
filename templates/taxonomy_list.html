{% extends "base.html" %}

{% block title %}{{ taxonomy.name | title }}{% endblock title %}

{% block content %}

<h2 style="font-family:'CommitMono',monospace;font-size:12px;color:#98C379;margin-bottom:20px">&gt;&gt; {{ taxonomy.name | upper }}</h2>

<ul style="list-style:none;padding:0;margin:0">
{% for term in terms %}
<li style="border-left:2px solid #2A2F36;padding-left:16px;margin-bottom:16px">
<a href="{{ term.permalink | safe }}" style="color:#E6E6E6;text-decoration:none">{{ term.name }}</a>
<span style="font-family:'CommitMono',monospace;font-size:12px;color:#5C6370"> ({{ term.pages | length }})</span>
</li>
{% endfor %}
</ul>

{% endblock content %}
